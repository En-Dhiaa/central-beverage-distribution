name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore backend/Beverage.sln

    - name: Build Backend
      run: dotnet build backend/Beverage.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test backend/tests/Beverage.UnitTests/Beverage.UnitTests.csproj --no-build --configuration Release --verbosity normal

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: |
        cd frontend
        npm ci || npm install

    - name: Frontend Build
      run: |
        cd frontend
        npm run build

